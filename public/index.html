<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Man Night · Est. 2007</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Man Night" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">M</div>
          <div>
            <div class="brand-title">Man Night</div>
            <div class="brand-sub">Est. 2007 · <span id="hdr-count">614</span> dinners</div>
          </div>
        </div>
        <nav class="nav-desktop" aria-label="Primary navigation">
          <button class="nav-btn active" data-tab="week">This week</button>
          <button class="nav-btn" data-tab="history">History</button>
          <button class="nav-btn" data-tab="places">Places</button>
          <button class="nav-btn" data-tab="crew">Crew</button>
        </nav>
        <div class="topbar-actions">
          <button id="btn-install-top" class="icon-pill" title="Install Man Night on iPhone or Android">Install</button>
          <button id="btn-whats-new" class="icon-pill whats-new-pill" title="What’s new &amp; crew credits" aria-label="What’s new">
            <span aria-hidden="true">✨</span>
            <span class="whats-new-pill-label">What’s new</span>
            <span id="whats-new-badge" class="whats-new-count hidden"></span>
          </button>
          <button id="btn-help" class="icon-pill" title="How Man Night works" aria-label="How Man Night works">?</button>
          <button id="btn-report-top" class="icon-pill" title="Report an issue">Report issue</button>
          <div class="user-menu-wrap" id="user-menu-wrap">
            <button id="user-pill" class="user-pill" type="button" aria-haspopup="true" aria-expanded="false" title="Account &amp; Settings">
              <span id="user-avatar" class="av avt">T</span>
              <span id="user-name" class="user-name-label">Tyler</span>
              <span class="user-caret" aria-hidden="true">▾</span>
            </button>
            <div id="user-menu" class="user-dropdown hidden" role="menu">
              <div class="user-dropdown-head">
                <div id="user-menu-name" class="user-dropdown-name">Tyler</div>
                <div id="user-menu-email" class="user-dropdown-email">Signed in</div>
              </div>
              <button type="button" class="user-dropdown-item" data-action="open-whats-new">
                <span>What’s new</span>
                <span id="menu-whats-new-hint" class="user-dropdown-hint">Updates &amp; credits</span>
              </button>
              <button type="button" class="user-dropdown-item" data-action="open-settings">
                <span>Settings</span>
                <span class="user-dropdown-hint">Theme &amp; Alerts</span>
              </button>
              <div class="user-dropdown-sep"></div>
              <a href="/api/logout" class="user-dropdown-item danger">
                <span>Log out</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content">
      <div class="loading-card">Loading Man Night…</div>
    </main>

    <nav class="nav-mobile" aria-label="Mobile navigation">
      <button class="mob-btn active" data-tab="week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3" /><path d="M8 2v4M16 2v4M3 10h18" /></svg>
        <span>This week</span>
      </button>
      <button class="mob-btn" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
        <span>History</span>
      </button>
      <button class="mob-btn" data-tab="places">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z" /><circle cx="12" cy="11" r="2.2" /></svg>
        <span>Places</span>
      </button>
      <button class="mob-btn" data-tab="crew">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M3 19c0-3.2 2.7-5 6-5s6 1.8 6 5" /><circle cx="17" cy="9" r="2.5" /><path d="M17 14c2.4 0 4.2 1.3 4.2 4" /></svg>
        <span>Crew</span>
      </button>
    </nav>
  </div>

  <!-- Modal Layer -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-panel" class="modal-panel"></div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
